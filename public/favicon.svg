<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ros2-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="ros2-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0a0e1a"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#ros2-grad)" stroke-opacity="0.3" stroke-width="1"/>
  <!-- R letter -->
  <path d="M20 16 L20 48 M20 16 L34 16 Q42 16 42 24 Q42 32 34 32 L20 32 M32 32 L42 48" 
        stroke="url(#ros2-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ros2-glow)"/>
  <!-- Node connection dots representing ROS graph -->
  <circle cx="48" cy="20" r="2.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="52" cy="28" r="1.5" fill="#2dd4bf" opacity="0.6"/>
  <circle cx="46" cy="40" r="2" fill="#22d3ee" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="42" y1="24" x2="48" y2="20" stroke="#22d3ee" stroke-width="0.8" opacity="0.4" stroke-dasharray="1 1"/>
  <line x1="42" y1="32" x2="46" y2="40" stroke="#2dd4bf" stroke-width="0.8" opacity="0.4" stroke-dasharray="1 1"/>
</svg>
